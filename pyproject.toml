[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26-sdf"
version = "0.1.0"
description = "Isolated custom modules for the YOLO26-SDF research project"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["object-detection", "yolo26", "small-object", "bdd100k", "visdrone"]

[project.optional-dependencies]
refinement = ["sahi==0.11.36"]

[tool.setuptools.packages.find]
include = ["sdf*"]
