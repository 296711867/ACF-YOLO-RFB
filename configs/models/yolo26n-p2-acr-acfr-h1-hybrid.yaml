# H1 (P20-B hybrid candidate): neck DWConv at L23/L26 (P-N proven harmless) + backbone
# high-level width slim x0.8 (dense convs kept, channels 128->104 / 256->208).
# Detect-head input widths and all protected paths unchanged.
# Pretrained weights for L5-L10 (shape change) and L23/L26 (module change) do not
# transfer; all other layers incl. the Detect head still load.

nc: 80
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [416, 3, 2]] # 5-P4/16 slim 128->104
  - [-1, 2, C3k2, [416, True]]
  - [-1, 1, Conv, [832, 3, 2]] # 7-P5/32 slim 256->208
  - [-1, 2, C3k2, [832, True]]
  - [-1, 2, SPPF, [832, 5, 3, True]]
  - [-1, 2, C2PSA, [832]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, ACFRConcat, [4, 0.5, 4]] # cat backbone P2 (adaptive complementary fusion)
  - [-1, 2, C3k2, [256, True]] # 19-P2/4 widened 32 -> 64

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 22-P3/8

  - [-1, 1, DWConv, [256, 3, 2]] # 23 lightweight (neck)
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 25-P4/16

  - [-1, 1, DWConv, [512, 3, 2]] # 26 lightweight (neck)
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True, 0.5, True]] # 28-P5/32 slimmed 256 -> 192

  - [[19, 22, 25, 28], 1, Detect, [nc]]
