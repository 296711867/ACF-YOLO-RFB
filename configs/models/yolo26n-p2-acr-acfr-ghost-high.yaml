# U2 (P20 lightweight unit screen): high-level plain Conv layers of the frozen
# ACR+ACFR teacher replaced by GhostConv at identical positions. Swapped layers:
# L5 (backbone P3->P4 downsample), L7 (backbone P4->P5 downsample),
# L23 (neck P3->P4 downsample), L26 (neck P4->P5 downsample).
# Everything on the P2/P3 small-object paths, ACFR, and Detect is untouched.
# GhostConv (3x3 primary + 5x5 depthwise cheap op) per upstream ultralytics; pretrained weights
# for the four swapped layers do not transfer, all other layers still load.

nc: 80
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16 lightweight (GhostConv)
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, GhostConv, [1024, 3, 2]] # 7-P5/32 lightweight (GhostConv)
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 2, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, ACFRConcat, [4, 0.5, 4]] # cat backbone P2 (adaptive complementary fusion)
  - [-1, 2, C3k2, [256, True]] # 19-P2/4 widened 32 -> 64

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 22-P3/8

  - [-1, 1, GhostConv, [256, 3, 2]] # 23 lightweight (GhostConv)
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 25-P4/16

  - [-1, 1, GhostConv, [512, 3, 2]] # 26 lightweight (GhostConv)
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True, 0.5, True]] # 28-P5/32 slimmed 256 -> 192

  - [[19, 22, 25, 28], 1, Detect, [nc]]
