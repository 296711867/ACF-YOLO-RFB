# P-N (P20 position ablation): neck-only DWConv at L23/L26; the backbone
# high-level convs L5/L7 stay plain Conv. Everything else is identical to
# the frozen ACR+ACFR teacher. Complements P-B; P-BN equals the U1 screen model.
# DWConv uses groups=gcd(c1,c2); pretrained weights for layers 23/26 do not
# transfer, all other layers still load.

nc: 80
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 plain Conv in P-N
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 plain Conv in P-N
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 2, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, ACFRConcat, [4, 0.5, 4]] # cat backbone P2 (adaptive complementary fusion)
  - [-1, 2, C3k2, [256, True]] # 19-P2/4 widened 32 -> 64

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 22-P3/8

  - [-1, 1, DWConv, [256, 3, 2]] # 23 lightweight (neck)
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 25-P4/16

  - [-1, 1, DWConv, [512, 3, 2]] # 26 lightweight (neck)
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True, 0.5, True]] # 28-P5/32 slimmed 256 -> 192

  - [[19, 22, 25, 28], 1, Detect, [nc]]
