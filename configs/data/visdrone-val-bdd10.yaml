# P32 VisDrone zero-shot: BDD-10-class mapped view of the official val split
# (548 images). Labels are class-remapped by scripts/prepare_visdrone_bdd10_view.py;
# images/val holds hardlinks into data/VisDrone/images/val (hardlinks, not symlinks:
# the evaluator resolves prediction image paths and a symlink would resolve back
# to the native-label tree). Run commands from the repository root so this
# relative path resolves consistently. train is a placeholder required by
# check_det_dataset; P32 never uses the train split.
path: data/VisDrone/bdd10
train: images/val
val: images/val

names:
  0: person
  1: rider
  2: car
  3: truck
  4: bus
  5: train
  6: motor
  7: bike
  8: traffic light
  9: traffic sign
