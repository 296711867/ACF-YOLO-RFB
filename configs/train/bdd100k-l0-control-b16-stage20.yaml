data: configs/data/bdd100k.yaml
imgsz: 640
epochs: 200
stage_stop_epoch: 20
batch: 16
nbs: 64
device: "0"
workers: 8
optimizer: auto
seed: 0
deterministic: true
amp: true
patience: 50
project: runs/detect/phase23-confound-control
name: bdd100k-l0-control-640-e200-stop20-b16-seed0
exist_ok: false
save: true
plots: true
verbose: true
