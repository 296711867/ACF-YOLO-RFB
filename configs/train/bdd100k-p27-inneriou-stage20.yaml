data: configs/data/bdd100k.yaml
imgsz: 640
epochs: 200
stage_stop_epoch: 20
batch: 32
nbs: 64
device: "0"
workers: 8
optimizer: auto
seed: 0
deterministic: true
amp: true
patience: 50
box_iou_variant: inner
inner_iou_ratio: 0.8
project: runs/detect/phase27-loss-screen
name: bdd100k-p27-inneriou-r08-640-e200-stop20-b32-seed0
exist_ok: false
save: true
plots: true
